name: 'Zero Infra Mod Registry'
description: 'Manage mod repositories, dependencies, and releases using Docker (no dependencies required)'
author: 'Jacob Barber'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  command:
    description: 'Command to execute (add-package-release, add-dll-release, remove, validate)'
    required: true
  repo_url:
    description: 'Repository URL (required for add-package-release, add-dll-release, and remove commands)'
    required: false
    default: ''
  release_tag:
    description: 'Release tag (required for add-package-release and add-dll-release commands)'
    required: false
    default: ''
  dry_run:
    description: 'Run in dry-run mode without making changes'
    required: false
    default: 'false'
  dll_file:
    description: 'Exact DLL asset filename for add-dll-release (required for multiple DLL assets)'
    required: false
    default: ''
  github_token:
    description: 'GitHub token for API access'
    required: true
    default: ${{ github.token }}
  log_level:
    description: 'Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)'
    required: false
    default: 'INFO'
  registry_path:
    description: 'Path to the registry directory'
    required: false
    default: './registry'
  package_db_path:
    description: 'Path to the package database directory'
    required: false
    default: './package_db'
  dll_db_path:
    description: 'Path to the separate DLL database directory'
    required: false
    default: './dll_db'
  verify_dll_downloads:
    description: 'Download and verify registered DLL hashes and sizes during validation'
    required: false
    default: 'false'

outputs:
  result:
    description: 'Output log from the command execution'
  failed:
    description: 'Whether the command failed or not'

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.command }}
    - ${{ inputs.repo_url }}
    - ${{ inputs.release_tag }}
  env:
    GITHUB_TOKEN: ${{ inputs.github_token }}
    LOG_LEVEL: ${{ inputs.log_level }}
    REGISTRY_PATH: ${{ inputs.registry_path }}
    PACKAGE_DB_PATH: ${{ inputs.package_db_path }}
    DLL_DB_PATH: ${{ inputs.dll_db_path }}
    VERIFY_DLL_DOWNLOADS: ${{ inputs.verify_dll_downloads }}
    DRY_RUN: ${{ inputs.dry_run }}
    DLL_FILE: ${{ inputs.dll_file }}
