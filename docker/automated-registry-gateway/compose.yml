services:
  automated-registry-gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/chiv2-community/automated-registry-gateway:prepare-v1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file: gateway.env
    environment:
      GITHUB_PRIVATE_KEY_FILE: /run/secrets/github-app.pem
    secrets:
      - source: github-app-key
        target: github-app.pem
    volumes:
      - gateway-state:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
secrets:
  github-app-key:
    file: ./github-app.pem
volumes:
  gateway-state:
