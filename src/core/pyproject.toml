[project]
name = "mod-registry-core"
version = "1.0.0"
description = "Shared typed JSON utilities"
requires-python = ">=3.12"
dependencies = ["cattrs>=26.2.1", "jsonschema>=4.26.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mod_registry_core"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
