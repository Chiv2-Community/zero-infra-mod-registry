[project]
name = "generated-models"
version = "1.0.0"
description = "Schema-generated registry metadata and request types"
requires-python = ">=3.12"
dependencies = [
    "cattrs>=26.2.1",
    "jsonschema[format-nongpl]>=4.26.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generated_models"]

[tool.hatch.build.hooks.custom]
path = "build_schemas.py"
