[project]
name = "mod-registry-core"
version = "1.0.0"
description = "Shared typed JSON utilities"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.26.0", "generated-models==1.0.0"]

[tool.uv.sources]
generated-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mod_registry_core"]
