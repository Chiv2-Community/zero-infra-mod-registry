[project]
name = "code-gen"
version = "1.0.0"
description = "Development-time registry model generation"
requires-python = ">=3.12"
dependencies = [
    "datamodel-code-generator[black,isort]==0.88.0",
    "generated-models==1.0.0",
]

[tool.uv.sources]
generated-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_gen"]
