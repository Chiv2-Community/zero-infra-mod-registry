[project]
name = "mod-registry-registration-core"
version = "1.0.0"
description = "Shared registration issue transport and release-asset policy"
requires-python = ">=3.12"
dependencies = ["generated-models==1.0.0"]

[tool.uv.sources]
generated-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mod_registry_registration_core"]
