[project]
name = "automated-registry-gateway"
version = "1.0.0"
description = "Optional OIDC registration gateway"
requires-python = ">=3.12"
dependencies = [
    "mod-registry-core==1.0.0",
    "cryptography>=46.0.0",
    "requests>=2.32.5",
    "semver>=3.0.4",
]

[project.scripts]
automated-registry-gateway = "automated_registry_gateway.server:main"

[tool.uv.sources]
mod-registry-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automated_registry_gateway"]
