$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/Chiv2-Community/zero-infra-mod-registry/main/schemas/plugin.schema.yaml
title: DLL plugin metadata (plugin.json)
type: object
required:
- name
- description
- authors
additionalProperties: false
properties:
  $schema:
    description: URI of the schema describing this metadata document.
    type: string
    format: uri
  repo_url:
    $ref: common.schema.yaml#/$defs/pluginRepository
    description: GitHub repository URL of the DLL plugin package.
  name:
    description: Display name of the DLL plugin.
    $ref: '#/$defs/text'
  description:
    description: Description of the DLL plugin.
    $ref: '#/$defs/text'
  authors:
    description: Names of the DLL plugin's authors.
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/text'
  target:
    $ref: dll-metadata.schema.yaml#/$defs/target
    default: shared
    description: Execution side of the DLL plugin, as server, client, or shared.
  icon_url:
    anyOf:
    - $ref: '#/$defs/mediaUrl'
    - type: 'null'
    description: URL of the plugin icon.
  image_urls:
    type: array
    items:
      $ref: '#/$defs/mediaUrl'
    default: []
    description: URLs of plugin screenshots or other images.
  mod_dependencies:
    $ref: common.schema.yaml#/$defs/dependencies
    uniqueItems: true
    default: []
    description: Pak packages required by this plugin, with version requirements.
  plugin_dependencies:
    $ref: common.schema.yaml#/$defs/pluginDependencies
    uniqueItems: true
    default: []
    description: DLL plugins required by this plugin, with version requirements.
$defs:
  text:
    $ref: common.schema.yaml#/$defs/text
  mediaUrl:
    $ref: common.schema.yaml#/$defs/mediaUrl
