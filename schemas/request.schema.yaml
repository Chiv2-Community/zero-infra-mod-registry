$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/Chiv2-Community/zero-infra-mod-registry/main/schemas/request.schema.yaml
$ref: '#/$defs/request'
$defs:
  request:
    title: RegistrationRequest
    description: Registration request for a pak or DLL release.
    type: object
    required:
    - action
    - repo_url
    - release_tag
    x-python-omit-none: true
    properties:
      action:
        description: Registration action identifying a pak release or DLL release.
        type: string
        enum:
        - add-package-release
        - add-dll-release
      repo_url:
        description: GitHub repository URL of the release publisher.
        type: string
        pattern: \S
      release_tag:
        description: Exact GitHub release tag.
        type: string
        pattern: \S
      dll_file:
        description: Filename of the DLL asset in the release.
        type: string
        pattern: \S
