$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/Chiv2-Community/zero-infra-mod-registry/main/schemas/dll-metadata.schema.yaml
$ref: '#/$defs/pluginInfo'
$defs:
  target:
    title: PluginTarget
    type: string
    enum:
    - server
    - client
    - shared
  pluginInfo:
    title: PluginInfo
    type: object
    required:
    - name
    - description
    - authors
    additionalProperties: false
    x-python-omit-none: true
    properties:
      name:
        $ref: common.schema.yaml#/$defs/text
      description:
        $ref: common.schema.yaml#/$defs/text
      authors:
        type: array
        minItems: 1
        items:
          $ref: common.schema.yaml#/$defs/text
      plugin_dependencies:
        $ref: common.schema.yaml#/$defs/pluginDependencies
        default: []
      icon_url:
        anyOf:
        - $ref: common.schema.yaml#/$defs/mediaUrl
        - type: 'null'
        default: null
      image_urls:
        type: array
        items:
          $ref: common.schema.yaml#/$defs/mediaUrl
        default: []
        x-python-omit-empty: true
      mod_dependencies:
        $ref: common.schema.yaml#/$defs/dependencies
        default: []
      repo_url:
        type:
        - string
        - 'null'
        default: null
      target:
        $ref: '#/$defs/target'
        default: shared
      $schema:
        type: string
        x-python-name: field_schema
  pluginRelease:
    title: PluginRelease
    type: object
    required:
    - tag
    - hash
    - dll_file_name
    - download_url
    - size
    - release_date
    - info
    - release_notes_markdown
    additionalProperties: false
    properties:
      tag:
        type: string
      hash:
        type: string
      download_url:
        type: string
      size:
        type: integer
      dll_file_name:
        type:
        - string
        - 'null'
      release_date:
        type:
        - string
        - 'null'
        x-python-datetime: true
      info:
        $ref: '#/$defs/pluginInfo'
      release_notes_markdown:
        type:
        - string
        - 'null'
  pluginPackage:
    title: PluginPackage
    type: object
    required:
    - latest_release_info
    - releases
    additionalProperties: false
    properties:
      latest_release_info:
        $ref: '#/$defs/pluginInfo'
      releases:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/pluginRelease'
  dllRelease:
    title: DllRelease
    description: Resolved DLL release after adding source repository identity.
    type: object
    required:
    - organization
    - name
    - version
    - download_url
    - sha256
    - size
    properties:
      organization:
        type: string
        pattern: ^[A-Za-z0-9_-]+(?![\s\S])
      name:
        type: string
        pattern: ^[A-Za-z0-9_-]+(?![\s\S])
      version:
        type: string
      download_url:
        allOf:
        - $ref: common.schema.yaml#/$defs/mediaUrl
        pattern: ^https://[^/?#]+/[^?#]*\.[dD][lL][lL](?:\?[^#]*)?(?![\s\S])
      sha256:
        type: string
        pattern: ^[a-f0-9]{64}(?![\s\S])
      size:
        type: integer
        minimum: 1
      info:
        anyOf:
        - $ref: '#/$defs/pluginInfo'
        - type: 'null'
        default: null
      tag:
        type:
        - string
        - 'null'
        default: null
      release_date:
        type:
        - string
        - 'null'
        default: null
        x-python-datetime: true
      release_notes_markdown:
        type:
        - string
        - 'null'
        default: null
      dll_file_name:
        type:
        - string
        - 'null'
        pattern: ^[^/\\]*\.[dD][lL][lL](?![\s\S])
        default: null
  plugin:
    title: Plugin
    description: Resolved plugin releases; latest metadata is computed at serialization.
    type: object
    required:
    - releases
    properties:
      releases:
        type: array
        items:
          $ref: '#/$defs/dllRelease'
