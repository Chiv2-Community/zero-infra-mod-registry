name: CI

on:
  push:
    branches: [ main, prepare-v1 ]
  pull_request:
    branches: [ main, prepare-v1 ]

jobs:
  test-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test actions/request-release/*.test.cjs
      - run: bash tests/actions/test-publish-branch.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run mypy
        run: uv run mypy .

      - name: Run pytest
        run: uv run pytest .

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: zero-infra-mod-registry:${{ github.run_number }}
          load: true

      - name: Validate program in built image
        run: |
          docker run --rm zero-infra-mod-registry:${{ github.run_number }} --help

      - name: Test action argument handling and failure outputs
        run: bash tests/actions/test-registry-action.sh zero-infra-mod-registry:${{ github.run_number }}

      - name: Validate .net installation
        run: |
          docker run --rm --entrypoint=/usr/local/bin/UnchainedScanner zero-infra-mod-registry:${{ github.run_number }} --help
