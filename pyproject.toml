[project]
name = "zero_infra_mod_registry"
version = "0.1.0"
description = ""
authors = [
    { name = "Jacob Barber", email = "jacoby6000@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyGithub>=2.5.0",
    "requests>=2.31.0",
    "types-requests>=2.31.0.2",
    "argparse>=1.4.0",
    "types-urllib3>=1.26.25.14",
    "urllib3>=2.0.4",
    "semver>=3.0.4",
    "types-setuptools>=65.3.0.5",
    "semantic-version>=2.10.0",
]

[project.scripts]
zero-infra-mod-registry = "zero_infra_mod_registry.main:main"

[dependency-groups]
dev = [
    "mypy>=1.4.1",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["src"]

[tool.coverage.run]
source = ["zero_infra_mod_registry"]
omit = ["tests/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zero_infra_mod_registry"]
