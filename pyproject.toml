[project]
name = "zero_infra_mod_registry"
version = "1.0.0"
description = ""
authors = [
    { name = "Jacob Barber", email = "jacoby6000@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyGithub>=2.8.1",
    "requests>=2.32.5",
    "types-requests>=2.32.4",
    "argparse>=1.4.0",
    "types-urllib3>=1.26.25.14",
    "urllib3>=2.0.5",
    "semver>=3.0.4",
    "jsonschema>=4.26.0",
    "mod-registry-core==1.0.0",
]
[project.scripts]
zero-infra-mod-registry = "zero_infra_mod_registry.main:main"

[dependency-groups]
dev = [
    "automated-registry-gateway==1.0.0",
    "mypy>=1.19.1",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.uv.workspace]
members = ["src/core", "src/automated-registry-gateway"]

[tool.uv.sources]
mod-registry-core = { workspace = true }
automated-registry-gateway = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["src"]

[tool.coverage.run]
source = ["zero_infra_mod_registry", "automated_registry_gateway", "mod_registry_core"]
omit = ["tests/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zero_infra_mod_registry"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "zero_infra_mod_registry/schemas"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_unimported = true
disallow_any_decorated = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "truthy-iterable", "unused-awaitable", "explicit-override", "mutable-override"]
